.entity.movable { transition: left .25s ease-out, top .38s cubic-bezier(.34,1.56,.64,1); cursor: grab; }
.anim-happy { animation: hop .45s ease-in-out 2; }
.anim-tickle { animation: dance .3s ease-in-out 4; }
.anim-wave { animation: wiggle .4s ease-in-out 3; }
.burst { position: absolute; left: 50%; top: 10%; font-size: clamp(16px, 3vw, 34px); pointer-events: none; z-index: 70; animation: burst 1.1s ease-out forwards; transform: translateX(-50%); }
@keyframes burst { 0% { opacity: 0; transform: translate(-50%, 0) scale(.4); } 20% { opacity: 1; transform: translate(calc(-50% + var(--bx)), -30%) scale(1.15); } 100% { opacity: 0; transform: translate(calc(-50% + var(--bx) * 1.6), -160%) scale(.9); } }

.sprite-img { -webkit-user-drag: none; user-select: none; pointer-events: none; filter: drop-shadow(0 6px 6px rgba(91,58,94,.18)); }
.anim-sad { animation: none; }

/* ── Full-screen free play ── */
.room-wrap.full > .room { grid-area: 1 / 1; --stage-w: min(100%, calc(100dvh * 10 / 7)); }
.room-ext { overflow: visible; }
.room-tabs { top: 64px; z-index: 30; scrollbar-width: none; }
.room-tabs > .tabs-spacer { pointer-events: none !important; }
.scene-actions { left: 8px; bottom: 8px; z-index: 30; }
.scene-actions p { display: none; }
.hud > button { white-space: nowrap; flex-shrink: 0; }
.room-tabs::-webkit-scrollbar { display: none; }
.scene-actions > button { box-shadow: 0 4px 0 #2B2350; }
@media (max-height: 520px) {
  .room-tabs { top: 52px; }
  .scene-actions { left: 6px; bottom: 6px; }
}
.hud-float .hud { pointer-events: none; }
.hud-float .hud > * { pointer-events: auto; }
@media (max-height: 520px) {
  .hud > button[class*="md:flex"] { display: none !important; }
  .hud > button[class*="md:hidden"] { display: block !important; }
}
/* keep buttons clear of the iPhone notch in landscape */
.hud { padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.room-tabs { padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.scene-actions { left: max(8px, env(safe-area-inset-left, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
/* intro fits a sideways phone: everything, including the Play button, stays on screen */
.logo-big { font-size: clamp(44px, min(13vw, 17dvh), 150px); }
.intro { padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
@media (max-height: 520px) {
  .intro-card > div:first-child { height: 34dvh; margin-bottom: 0; }
  .intro-card > div:first-child > div { height: 100% !important; width: calc(34dvh * 0.42) !important; }
  .intro-card p { font-size: 16px; margin-top: 6px; }
  .intro-card button { margin-top: 10px; font-size: 22px; padding: 8px 32px; }
}
.entity .worn { pointer-events: auto; }
.mission-head { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-top: env(safe-area-inset-top, 0px); }
/* hugs: lean in toward the friend, squeeze, let go */
.anim-hugr, .anim-hugl { animation-duration: 1.8s; animation-timing-function: ease-in-out; transform-origin: 50% 100%; }
.anim-hugr { animation-name: hugr; }
.anim-hugl { animation-name: hugl; }
@keyframes hugr { 0%, 100% { transform: none } 20%, 80% { transform: translateX(8%) rotate(6deg) } 40% { transform: translateX(10%) rotate(7deg) scale(1.03, .97) } 60% { transform: translateX(10%) rotate(7deg) scale(.98, 1.02) } }
@keyframes hugl { 0%, 100% { transform: none } 20%, 80% { transform: translateX(-8%) rotate(-6deg) } 40% { transform: translateX(-10%) rotate(-7deg) scale(1.03, .97) } 60% { transform: translateX(-10%) rotate(-7deg) scale(.98, 1.02) } }
.room-wrap { isolation: isolate; }
/* reward popup must fit a sideways phone (Yay! button always reachable) */
@media (max-height: 520px) {
  .reward-wrap { padding-top: 28px; align-items: start; }
  .reward-wrap .reward-in { padding: 14px 18px; }
  .reward-wrap .reward-in li { padding-top: 4px; padding-bottom: 4px; }
  .reward-wrap .reward-in ul { margin-top: 8px; }
  .reward-wrap .reward-in h2 { font-size: 22px; }
  .reward-wrap .star-spin { font-size: 40px; margin-top: -34px; }
}
/* painted town map (3:2) */
.town-art { --tw: max(100vw, calc(100dvh * 1.5)); width: var(--tw); height: calc(var(--tw) / 1.5); min-height: 100%; }
.art-building .art-crop { pointer-events: none; }
.art-building.soon .art-crop { filter: saturate(.55) brightness(1.04); }
.art-building:hover .art-crop, .art-building:focus-visible .art-crop { filter: brightness(1.08) drop-shadow(0 0 6px #fff); }
.balloon-spot { border-radius: 50%; }
.painted-night { background: radial-gradient(circle at 70% 30%, #FFF6C8 0 4%, transparent 5%), radial-gradient(circle at 20% 25%, #fff 0 1.2%, transparent 1.6%), radial-gradient(circle at 45% 60%, #fff 0 1%, transparent 1.4%), radial-gradient(circle at 80% 70%, #fff 0 1%, transparent 1.4%), linear-gradient(#232059, #3B3A8C); opacity: .92; transition: opacity .7s; }
.tv-screen { border-radius: 3px; background: linear-gradient(135deg, #7FD3F7, #FF7FB5 40%, #FFC93C 70%, #8BD46E); animation: tv 3s linear infinite; box-shadow: 0 0 18px rgba(127,211,247,.7); }
.lamp-glow { left: -60%; right: -60%; top: -25%; height: 75%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,236,160,.85), rgba(255,236,160,0)); }
